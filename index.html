<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語言學習試算表 (Excel 自由版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; }
        ::-webkit-scrollbar { display: none; }
        /* Excel 遮蓋樣式 */
        .excel-masked {
            background-color: #1e293b !important;
            color: #1e293b !important;
            cursor: pointer;
            user-select: none;
        }
        .excel-masked:hover {
            background-color: #334155 !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 p-2 md:p-6 flex flex-col items-center min-h-screen">

    <div id="app" class="w-full max-w-6xl bg-white shadow-2xl rounded-xl overflow-hidden flex flex-col min-h-[92vh]">
        
        <header class="bg-emerald-700 text-white p-4 flex flex-col lg:flex-row justify-between items-center gap-4 shadow-inner">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🟢</span>
                <h1 class="text-lg font-bold tracking-wider">Language_Learning_Sheets.xlsx</h1>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-1.5 bg-emerald-800 px-3 py-1.5 rounded border border-emerald-600 text-xs">
                    <span class="font-bold">👁️ 遮蓋眼罩：</span>
                    <button @click="maskColumnA = !maskColumnA" :class="maskColumnA ? 'bg-amber-500 text-slate-900' : 'bg-emerald-600'" class="px-2 py-0.5 rounded font-medium transition-colors">
                        {{ maskColumnA ? '已遮欄位 A' : '遮蓋欄位 A' }}
                    </button>
                    <button @click="maskColumnB = !maskColumnB" :class="maskColumnB ? 'bg-amber-500 text-slate-900' : 'bg-emerald-600'" class="px-2 py-0.5 rounded font-medium transition-colors">
                        {{ maskColumnB ? '已遮欄位 B' : '遮蓋欄位 B' }}
                    </button>
                </div>

                <div class="flex items-center gap-2 bg-emerald-800 px-3 py-1.5 rounded border border-emerald-600 text-xs">
                    <label class="font-bold text-emerald-200">🔍 字體與格子大小：</label>
                    <input type="range" min="14" max="32" v-model="excelFontSize" class="w-24 h-1 bg-emerald-900 rounded-lg appearance-none cursor-pointer accent-white">
                    <span class="font-mono text-emerald-300 font-bold">{{ excelFontSize }}px</span>
                </div>
            </div>
        </header>

        <div class="px-4 pt-3 flex gap-1 overflow-x-auto whitespace-nowrap bg-slate-200 border-b border-slate-300">
            <button v-for="category in categories" :key="category"
                    @click="selectedCategory = category"
                    class="px-4 py-2 text-xs font-bold border-t border-x rounded-t-lg transition-all duration-100"
                    :class="selectedCategory === category 
                            ? 'bg-white text-emerald-700 border-slate-300 shadow-sm z-10' 
                            : 'bg-slate-100 text-slate-600 border-transparent hover:bg-slate-50'">
                📊 {{ category }}
            </button>
            <button @click="showCategoryModal = true" class="px-2 py-2 text-slate-500 hover:text-slate-800 font-bold text-xs">
                ➕ 管理工作表
            </button>
        </div>

        <main class="flex-1 p-2 overflow-x-auto overflow-y-auto bg-slate-50">
            <table class="w-full border-collapse bg-white text-left shadow-sm border border-slate-300" :style="{ fontSize: `${excelFontSize}px` }">
                <thead>
                    <tr class="bg-slate-100 text-slate-600 text-xs font-bold border-b border-slate-300 select-none">
                        <th class="border border-slate-300 p-2 text-center w-12 bg-slate-200">編號</th>
                        <th class="border border-slate-300 p-2 bg-slate-100 min-w-[200px]">
                            欄位 A <span class="text-[10px] text-slate-400 font-normal">(雙擊可直接改字)</span>
                        </th>
                        <th class="border border-slate-300 p-2 bg-slate-100 min-w-[200px]">
                            欄位 B <span class="text-[10px] text-slate-400 font-normal">(雙擊可直接改字)</span>
                        </th>
                        <th class="border border-slate-300 p-2 text-center w-20 bg-slate-100">發聲</th>
                        <th class="border border-slate-300 p-2 text-center w-16 bg-slate-100">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(card, index) in filteredCards" :key="card.id" class="hover:bg-slate-50/80 transition-colors border-b border-slate-200">
                        <td class="border border-slate-300 p-2 text-center bg-slate-50 text-xs text-slate-400 font-mono select-none">
                            {{ index + 1 }}
                        </td>
                        
                        <td class="border border-slate-300 p-2 font-medium relative group" 
                            :class="{ 'excel-masked': maskColumnA && !card.showA }"
                            @click="card.showA = true">
                            <input v-model="card.zh" type="text" 
                                   class="w-full bg-transparent border-none focus:outline-none focus:bg-amber-50 rounded px-1 py-0.5 font-semibold text-slate-800"
                                   :disabled="maskColumnA && !card.showA">
                        </td>
                        
                        <td class="border border-slate-300 p-2 font-medium relative group"
                            :class="{ 'excel-masked': maskColumnB && !card.showB }"
                            @click="card.showB = true">
                            <input v-model="card.en" type="text" 
                                   class="w-full bg-transparent border-none focus:outline-none focus:bg-amber-50 rounded px-1 py-0.5 font-semibold text-slate-800"
                                   :disabled="maskColumnB && !card.showB">
                        </td>
                        
                        <td class="border border-slate-300 p-1 text-center select-none">
                            <button @click="playAudio(card)" 
                                    class="mx-auto w-8 h-8 rounded flex items-center justify-center border border-slate-200 transition-all shadow-sm"
                                    :class="card.isPlaying ? 'bg-emerald-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-100'">
                                <svg v-if="!card.isPlaying" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                                    <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" />
                                </svg>
                                <svg v-else xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                                    <path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 01.75-.75H9a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H7.5a.75.75 0 01-.75-.75V5.25zm7.5 0a.75.75 0 01.75-.75h1.5a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V5.25z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </td>

                        <td class="border border-slate-300 p-1 text-center select-none">
                            <button @click="removeCard(card.id)" class="text-slate-300 hover:text-red-500 p-1 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mx-auto"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div v-if="filteredCards.length === 0" class="text-center text-slate-400 py-12 text-sm">
                目前此工作表沒有任何資料列。
            </div>
            
            <div class="mt-8 bg-slate-200/60 p-4 border border-slate-300 rounded-lg">
                <h3 class="text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">➕ 插入新資料列（需上傳 MP3 音檔）</h3>
                <div class="flex flex-col md:flex-row gap-2 items-end">
                    <div class="w-full md:flex-1 grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input v-model="newCard.zh" type="text" placeholder="輸入欄位 A 內容" class="p-2 border border-slate-300 rounded text-sm bg-white">
                        <input v-model="newCard.en" type="text" placeholder="輸入欄位 B 內容" class="p-2 border border-slate-300 rounded text-sm bg-white">
                        <select v-model="newCard.category" class="p-2 border border-slate-300 rounded text-sm bg-white font-medium text-slate-700">
                            <option v-for="cat in categories.filter(c => c !== '全部')" :key="cat" :value="cat">工作表: {{ cat }}</option>
                        </select>
                    </div>
                </div>

                <div class="mt-3 p-2 bg-white rounded border border-slate-300 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div class="flex-1">
                        <label class="block text-[11px] font-bold text-slate-400 mb-0.5">選擇要綁定的 MP3 音檔：</label>
                        <input type="file" accept="audio/mp3, audio/*" @change="handleAudioUpload" class="text-xs text-slate-500 file:mr-4 file:py-1 file:px-2 file:rounded file:border file:border-slate-300 file:bg-slate-50 file:text-xs hover:file:bg-slate-100">
                    </div>
                    <p v-if="uploadStatus" class="text-xs text-emerald-600 font-bold bg-emerald-50 px-2 py-1 rounded">{{ uploadStatus }}</p>
                </div>

                <button @click="addNewCard" class="w-full bg-emerald-700 text-white p-2 rounded font-bold hover:bg-emerald-600 transition-colors shadow mt-3 text-xs">
                    插入此列
                </button>
            </div>
        </main>

        <div v-if="showCategoryModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg w-full max-w-sm overflow-hidden shadow-2xl border border-slate-300">
                <div class="p-3 bg-slate-800 text-white flex justify-between items-center select-none">
                    <h3 class="font-bold text-xs">📁 管理 Excel 工作表 分類</h3>
                    <button @click="showCategoryModal = false" class="text-slate-400 hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                
                <div class="p-4 space-y-4">
                    <div class="flex gap-2">
                        <input v-model="newCategoryName" @keyup.enter="addCategory" type="text" placeholder="新分類名稱..." class="flex-1 p-2 border border-slate-300 rounded text-xs focus:outline-none focus:border-emerald-600">
                        <button @click="addCategory" class="px-3 py-1 bg-emerald-700 text-white rounded text-xs font-bold hover:bg-emerald-600">新增</button>
                    </div>
                    
                    <div>
                        <h4 class="text-[10px] font-bold text-slate-400 mb-1.5 uppercase">現有工作表清單</h4>
                        <ul class="space-y-1 max-h-40 overflow-y-auto">
                            <li v-for="category in categories" :key="category" class="flex justify-between items-center p-2 rounded text-xs" :class="category === '全部' ? 'bg-slate-50 text-slate-400' : 'bg-slate-100 text-slate-700'">
                                <span class="font-bold">{{ category }}</span>
                                <button v-if="category !== '全部'" @click="removeCategory(category)" class="text-red-400 hover:text-red-600 p-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, computed, watch } = Vue;

        createApp({
            setup() {
                const categories = ref(['全部', '日常溝通', '貓咪飲食']);
                const selectedCategory = ref('全部');
                const showCategoryModal = ref(false);
                const newCategoryName = ref('');

                // 自由調整 Excel 字體大小樣式 (預設 16px)
                const excelFontSize = ref(16);

                // 欄位遮蓋開關狀態
                const maskColumnA = ref(false);
                const maskColumnB = ref(false);

                const newCard = ref({ zh: '', en: '', category: '日常溝通' });
                const tempAudioData = ref('');
                const uploadStatus = ref('');

                // 初始 Excel 欄位資料 (不限中英文左右，字體大小高度一致)
                const cards = ref([
                    { id: 1, zh: '我該如何回覆？', en: 'How should I respond?', category: '日常溝通', audioData: '', isPlaying: false, showA: false, showB: false },
                    { id: 2, zh: '這個放哪裡？', en: 'Where should I put this?', category: '日常溝通', audioData: '', isPlaying: false, showA: false, showB: false },
                    { id: 3, zh: '粗蛋白質', en: 'Crude Protein', category: '貓咪飲食', audioData: '', isPlaying: false, showA: false, showB: false }
                ]);

                // 當遮蓋總開關切換時，重設單格的點擊顯現狀態
                watch([maskColumnA, maskColumnB], () => {
                    cards.value.forEach(c => {
                        c.showA = false;
                        c.showB = false;
                    });
                });

                const filteredCards = computed(() => {
                    if (selectedCategory.value === '全部') return cards.value;
                    return cards.value.filter(card => card.category === selectedCategory.value);
                });

                const handleAudioUpload = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    uploadStatus.value = '讀取中...';
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        tempAudioData.value = e.target.result;
                        uploadStatus.value = `💾 ${file.name.substring(0, 10)}...`;
                    };
                    reader.readAsDataURL(file);
                };

                const addCategory = () => {
                    const name = newCategoryName.value.trim();
                    if (name && !categories.value.includes(name)) {
                        categories.value.push(name);
                        newCard.value.category = name;
                        newCategoryName.value = '';
                    }
                };

                const removeCategory = (catToRemove) => {
                    if (confirm(`確定刪除「${catToRemove}」工作表分類？`)) {
                        categories.value = categories.value.filter(c => c !== catToRemove);
                        if (selectedCategory.value === catToRemove) selectedCategory.value = '全部';
                    }
                };

                const addNewCard = () => {
                    if (!newCard.value.zh || !newCard.value.en) {
                        alert('請輸入欄位 A 與欄位 B 的內容！');
                        return;
                    }
                    if (!tempAudioData.value) {
                        alert('必須選取並上傳對應的 MP3 音檔！');
                        return;
                    }

                    cards.value.push({
                        id: Date.now(),
                        zh: newCard.value.zh,
                        en: newCard.value.en,
                        category: newCard.value.category,
                        audioData: tempAudioData.value, 
                        isPlaying: false,
                        showA: false,
                        showB: false
                    });

                    newCard.value.zh = '';
                    newCard.value.en = '';
                    tempAudioData.value = '';
                    uploadStatus.value = '';
                    
                    const fileInput = document.querySelector('input[type="file"]');
                    if (fileInput) fileInput.value = '';
                };

                const removeCard = (id) => {
                    cards.value = cards.value.filter(c => c.id !== id);
                };

                let currentAudio = null;
                let activeCard = null;

                const playAudio = (card) => {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }

                    if (activeCard === card && card.isPlaying) {
                        card.isPlaying = false;
                        activeCard = null;
                        return;
                    }

                    if (activeCard) activeCard.isPlaying = false;

                    if (!card.audioData) {
                        alert('此列無內嵌 MP3 音檔！');
                        return;
                    }

                    activeCard = card;
                    card.isPlaying = true;

                    currentAudio = new Audio(card.audioData);
                    currentAudio.play().catch(err => {
                        card.isPlaying = false;
                        activeCard = null;
                    });

                    currentAudio.onended = () => {
                        card.isPlaying = false;
                        activeCard = null;
                    };
                };

                return { 
                    cards, categories, selectedCategory, filteredCards, playAudio,
                    showCategoryModal, newCategoryName, addCategory, removeCategory,
                    newCard, addNewCard, removeCard, handleAudioUpload, uploadStatus,
                    excelFontSize, maskColumnA, maskColumnB
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
