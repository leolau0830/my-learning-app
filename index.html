<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的語言學習卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0f9ff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-sky-50 text-gray-800 flex justify-center min-h-screen">

    <div id="app" class="w-full max-w-md bg-white shadow-xl relative flex flex-col min-h-screen">
        
        <!-- 頂部導航列 -->
        <header class="bg-sky-500 text-white p-5 sticky top-0 z-10 shadow-md rounded-b-2xl">
            <h1 class="text-xl font-bold text-center tracking-wider">實用語句學習</h1>
        </header>

        <!-- 分類標籤滑動區塊 -->
        <div class="px-5 pt-4 pb-2 flex gap-3 overflow-x-auto whitespace-nowrap sticky top-[68px] bg-white z-10 items-center">
            <button v-for="category in categories" :key="category"
                    @click="selectedCategory = category"
                    class="px-4 py-1.5 rounded-full text-sm font-medium transition-colors duration-200 shadow-sm border"
                    :class="selectedCategory === category 
                            ? 'bg-sky-500 text-white border-sky-500' 
                            : 'bg-white text-sky-600 border-sky-200 hover:bg-sky-50'">
                {{ category }}
            </button>
            
            <button @click="showCategoryModal = true" 
                    class="shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-sky-100 text-sky-600 border border-sky-200 hover:bg-sky-200">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
            </button>
        </div>

        <!-- 卡片列表區塊 -->
        <main class="flex-1 p-5 space-y-4 overflow-y-auto pb-6">
            
            <div v-for="card in filteredCards" :key="card.id" 
                 class="border border-sky-100 p-5 rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 relative group"
                 :class="card.bgColor">
                 
                <!-- 刪除按鈕 -->
                <button @click="removeCard(card.id)" class="absolute top-2 right-2 p-1 text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>

                <div class="flex justify-between items-start gap-4">
                    <div class="flex-1">
                        <span class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-white/60 text-slate-500 mb-2 border border-slate-100">
                            {{ card.category }}
                        </span>
                        <h2 class="text-lg font-bold text-slate-800 mb-1">{{ card.zh }}</h2>
                        <p class="text-sky-700 font-medium mb-2">{{ card.en }}</p>
                        
                        <!-- 狀態：是否成功錄入實體 MP3 -->
                        <span class="text-xs flex items-center gap-1" :class="card.audioData ? 'text-emerald-600' : 'text-amber-500'">
                            <span class="w-1.5 h-1.5 rounded-full" :class="card.audioData ? 'bg-emerald-500' : 'bg-amber-500'"></span>
                            {{ card.audioData ? '🎵 MP3 已就緒' : '⚠️ 請新增 MP3 音檔' }}
                        </span>
                    </div>

                    <!-- 播放按鈕 -->
                    <button @click="playAudio(card)" 
                            class="shrink-0 w-11 h-11 rounded-full flex items-center justify-center transition-colors duration-200 shadow-sm mt-2"
                            :class="card.isPlaying ? 'bg-sky-500 text-white' : 'bg-white text-sky-500 hover:bg-sky-100'">
                        <svg v-if="!card.isPlaying" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 ml-0.5">
                            <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" />
                        </svg>
                        <svg v-else xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                            <path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 01.75-.75H9a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H7.5a.75.75 0 01-.75-.75V5.25zm7.5 0a.75.75 0 01.75-.75h1.5a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V5.25z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>

            <div v-if="filteredCards.length === 0" class="text-center text-gray-400 py-10">
                這個分類目前沒有單字卡哦！
            </div>
            
            <!-- 新增學習卡表單 -->
            <div class="mt-8 pt-6 border-t border-sky-100 bg-sky-50/50 p-4 rounded-2xl border border-dashed">
                <h3 class="text-sm font-bold text-slate-600 mb-3 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/xl" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    新增自訂學習卡
                </h3>
                <div class="space-y-3">
                    <input v-model="newCard.zh" type="text" placeholder="輸入中文" class="w-full p-2.5 bg-white border border-sky-200 rounded-xl focus:outline-none focus:border-sky-500 text-sm shadow-sm">
                    <input v-model="newCard.en" type="text" placeholder="輸入英文" class="w-full p-2.5 bg-white border border-sky-200 rounded-xl focus:outline-none focus:border-sky-500 text-sm shadow-sm">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <select v-model="newCard.category" class="p-2.5 bg-white border border-sky-200 rounded-xl focus:outline-none focus:border-sky-500 text-sm shadow-sm">
                            <option v-for="cat in categories.filter(c => c !== '全部')" :key="cat" :value="cat">📁 {{ cat }}</option>
                        </select>
                        
                        <select v-model="newCard.bgColor" class="p-2.5 bg-white border border-sky-200 rounded-xl focus:outline-none focus:border-sky-500 text-sm shadow-sm">
                            <option value="bg-white">⚪ 白色卡片</option>
                            <option value="bg-sky-50">🔷 天藍卡片</option>
                            <option value="bg-emerald-50">🟢 淺綠卡片</option>
                            <option value="bg-rose-50">🔴 淺紅卡片</option>
                            <option value="bg-amber-50">🟡 淺黃卡片</option>
                        </select>
                    </div>

                    <!-- 必填的 MP3 上傳 -->
                    <div class="bg-white border border-sky-200 p-2.5 rounded-xl shadow-sm">
                        <label class="block text-xs font-bold text-gray-400 mb-1">上傳 MP3 音檔 (必要)</label>
                        <input type="file" accept="audio/mp3, audio/*" @change="handleAudioUpload" class="w-full text-xs text-slate-500 file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-sky-100 file:text-sky-700 hover:file:bg-sky-200">
                        <p v-if="uploadStatus" class="text-xs text-sky-600 mt-1 font-medium">{{ uploadStatus }}</p>
                    </div>

                    <button @click="addNewCard" class="w-full bg-sky-500 text-white p-2.5 rounded-xl font-medium hover:bg-sky-600 transition-colors shadow-md mt-1">
                        儲存並加入卡片
                    </button>
                </div>
            </div>

        </main>

        <!-- 管理分類彈出視窗 -->
        <div v-if="showCategoryModal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
                <div class="p-5 border-b border-gray-100 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-slate-800">管理分類</h3>
                    <button @click="showCategoryModal = false" class="text-gray-400 hover:text-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                
                <div class="p-5 space-y-4">
                    <div class="flex gap-2">
                        <input v-model="newCategoryName" @keyup.enter="addCategory" type="text" placeholder="輸入新分類名稱..." class="flex-1 p-2 border border-sky-200 rounded-lg focus:outline-none focus:border-sky-500">
                        <button @click="addCategory" class="px-4 py-2 bg-sky-500 text-white rounded-lg font-medium hover:bg-sky-600">新增</button>
                    </div>
                    
                    <div class="mt-4">
                        <h4 class="text-xs font-bold text-gray-400 mb-2 uppercase">現有分類</h4>
                        <ul class="space-y-2 max-h-48 overflow-y-auto">
                            <li v-for="category in categories" :key="category" class="flex justify-between items-center p-2 rounded-lg" :class="category === '全部' ? 'bg-gray-50' : 'bg-sky-50'">
                                <span class="text-sm font-medium" :class="category === '全部' ? 'text-gray-500' : 'text-slate-700'">{{ category }}</span>
                                <button v-if="category !== '全部'" @click="removeCategory(category)" class="text-red-400 hover:text-red-600 p-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, computed } = Vue;

        createApp({
            setup() {
                const categories = ref(['全部', '日常溝通', '貓咪飲食']);
                const selectedCategory = ref('全部');
                const showCategoryModal = ref(false);
                const newCategoryName = ref('');

                const newCard = ref({ zh: '', en: '', category: '日常溝通', bgColor: 'bg-white' });
                const tempAudioData = ref(''); // 用來儲存 Base64 音訊編碼
                const uploadStatus = ref('');

                // 初始範例卡片 (預設沒有實體音檔，會提示需要上傳)
                const cards = ref([
                    { id: 1, zh: '預設卡片：我該如何回覆？', en: '請在下方自行上傳錄音或 MP3 檔測試', category: '日常溝通', bgColor: 'bg-white', audioData: '', isPlaying: false }
                ]);

                const filteredCards = computed(() => {
                    if (selectedCategory.value === '全部') return cards.value;
                    return cards.value.filter(card => card.category === selectedCategory.value);
                });

                // 【核心修正】將使用者上傳的 MP3 轉換為安全的 Base64 資料，確保全平台直接發聲
                const handleAudioUpload = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    uploadStatus.value = '正在讀取並封裝音檔...';
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        tempAudioData.value = e.target.result; // 這就是二進制的音訊字串
                        uploadStatus.value = `✅ 成功讀取：${file.name}`;
                    };

                    reader.onerror = () => {
                        alert('音檔讀取失敗，請換個檔案再試！');
                        uploadStatus.value = '';
                    };

                    reader.readAsDataURL(file); // 啟動轉換程序
                };

                const addCategory = () => {
                    const name = newCategoryName.value.trim();
                    if (name && !categories.value.includes(name)) {
                        categories.value.push(name);
                        newCard.value.category = name;
                        newCategoryName.value = '';
                    }
                };

                const removeCategory = (catToRemove) => {
                    if (confirm(`確定要刪除「${catToRemove}」分類嗎？`)) {
                        categories.value = categories.value.filter(c => c !== catToRemove);
                        if (selectedCategory.value === catToRemove) selectedCategory.value = '全部';
                    }
                };

                const addNewCard = () => {
                    if (!newCard.value.zh || !newCard.value.en) {
                        alert('請填寫中英文內容！');
                        return;
                    }
                    if (!tempAudioData.value) {
                        alert('請為這張卡片選擇一個 MP3 音檔！');
                        return;
                    }

                    cards.value.push({
                        id: Date.now(),
                        zh: newCard.value.zh,
                        en: newCard.value.en,
                        category: newCard.value.category,
                        bgColor: newCard.value.bgColor,
                        audioData: tempAudioData.value, // 直接儲存 Base64 字串
                        isPlaying: false
                    });

                    // 清空表單
                    newCard.value.zh = '';
                    newCard.value.en = '';
                    tempAudioData.value = '';
                    uploadStatus.value = '';
                    
                    const fileInput = document.querySelector('input[type="file"]');
                    if (fileInput) fileInput.value = '';
                };

                const removeCard = (id) => {
                    if (confirm('確定要刪除這張卡片嗎？')) {
                        cards.value = cards.value.filter(c => c.id !== id);
                    }
                };

                // 播放器邏輯
                let currentAudio = null;
                let activeCard = null;

                const playAudio = (card) => {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }

                    // 點擊正在播放的卡片就停止
                    if (activeCard === card && card.isPlaying) {
                        card.isPlaying = false;
                        activeCard = null;
                        return;
                    }

                    if (activeCard) activeCard.isPlaying = false;

                    if (!card.audioData) {
                        alert('這張卡片沒有綁定 MP3 音檔！請在下方建立一張帶有 MP3 的新卡片測試。');
                        return;
                    }

                    activeCard = card;
                    card.isPlaying = true;

                    // 直接使用封裝好的 Base64 播放，百分之百直接發出 MP3 的真實聲音
                    currentAudio = new Audio(card.audioData);
                    
                    // 部分手機（如 iPhone）的瀏覽器在靜音模式下會阻擋網頁聲音，這行能確保順利呼叫
                    currentAudio.play().catch(err => {
                        console.log("播放被阻擋，請確認手機已關閉靜音開關（震動鍵）", err);
                        card.isPlaying = false;
                        activeCard = null;
                    });

                    currentAudio.onended = () => {
                        card.isPlaying = false;
                        activeCard = null;
                    };
                };

                return { 
                    cards, categories, selectedCategory, filteredCards, playAudio,
                    showCategoryModal, newCategoryName, addCategory, removeCategory,
                    newCard, addNewCard, removeCard, handleAudioUpload, uploadStatus
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
