<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的語言學習 App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #e2e8f0; margin: 0; }
        /* 隱藏滾動條但保留滾動功能，讓畫面更像 App */
        ::-webkit-scrollbar { display: none; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #f8fafc; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <div id="app" class="app-container flex flex-col h-screen overflow-hidden">
        
        <header class="glass-header sticky top-0 z-30 px-5 pt-6 pb-3 border-b border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-xl font-bold text-slate-800 tracking-wide">學習字卡</h1>
                <button @click="showSettingsModal = true" class="w-9 h-9 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.341 3.612l.1-1.043a1.5 1.5 0 012.983 0l.1 1.043a1.5 1.5 0 001.378 1.258l1.042.1a1.5 1.5 0 011.026 2.652l-.84.7a1.5 1.5 0 00-.472 1.631l.36 1.01a1.5 1.5 0 01-2.28 1.662l-.93-.497a1.5 1.5 0 00-1.4 0l-.93.497a1.5 1.5 0 01-2.28-1.662l.36-1.01a1.5 1.5 0 00-.472-1.631l-.84-.7a1.5 1.5 0 011.026-2.652l1.042-.1a1.5 1.5 0 001.378-1.258z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                </button>
            </div>

            <div class="flex gap-2 bg-slate-100 p-1 rounded-xl">
                <button @click="maskColumnA = !maskColumnA" class="flex-1 py-1.5 rounded-lg text-sm font-bold transition-all shadow-sm" :class="maskColumnA ? 'bg-amber-400 text-slate-900' : 'bg-white text-slate-500'">
                    {{ maskColumnA ? '👁️ 已遮欄 A' : '遮蓋欄 A' }}
                </button>
                <button @click="maskColumnB = !maskColumnB" class="flex-1 py-1.5 rounded-lg text-sm font-bold transition-all shadow-sm" :class="maskColumnB ? 'bg-amber-400 text-slate-900' : 'bg-white text-slate-500'">
                    {{ maskColumnB ? '👁️ 已遮欄 B' : '遮蓋欄 B' }}
                </button>
            </div>
        </header>

        <div class="px-4 py-3 flex gap-2 overflow-x-auto whitespace-nowrap bg-white border-b border-slate-100 shrink-0 shadow-sm z-20">
            <button v-for="category in categories" :key="category"
                    @click="selectedCategory = category"
                    class="px-4 py-1.5 rounded-full text-sm font-bold transition-colors"
                    :class="selectedCategory === category ? 'bg-emerald-500 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'">
                {{ category }}
            </button>
            <button @click="showCategoryModal = true" class="px-3 py-1.5 rounded-full text-sm font-bold bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                管理
            </button>
        </div>

        <main class="flex-1 overflow-y-auto p-4 pb-24 space-y-4">
            
            <div v-for="(card, index) in filteredCards" :key="card.id" class="bg-white rounded-2xl p-4 shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] border border-slate-100 relative group">
                
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md tracking-wider">
                        #{{ index + 1 }}
                    </span>
                    
                    <div class="flex gap-2">
                        <button @click="removeCard(card.id)" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-300 hover:bg-red-50 hover:text-red-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                        <button @click="playAudio(card)" class="w-8 h-8 rounded-full flex items-center justify-center transition-all shadow-sm border border-emerald-100"
                                :class="card.isPlaying ? 'bg-emerald-500 text-white scale-110' : 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100'">
                            <svg v-if="!card.isPlaying" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 ml-0.5"><path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" /></svg>
                            <svg v-else xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 01.75-.75H9a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H7.5a.75.75 0 01-.75-.75V5.25zm7.5 0a.75.75 0 01.75-.75h1.5a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V5.25z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                </div>

                <div class="flex gap-3">
                    <div class="flex-1 relative">
                        <div v-if="maskColumnA && !card.showA" @click="card.showA = true" class="absolute inset-0 bg-slate-800 rounded-xl flex items-center justify-center cursor-pointer z-10 shadow-inner">
                            <span class="text-white text-xs font-bold tracking-widest opacity-80">點擊查看</span>
                        </div>
                        <textarea v-model="card.zh" @change="saveToLocalStorage" rows="2" 
                                  class="w-full bg-slate-50 border border-slate-100 rounded-xl p-3 resize-none focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:bg-white transition-all font-semibold text-slate-700" 
                                  :style="{ fontSize: `${excelFontSize}px`, lineHeight: '1.4' }" placeholder="欄位 A"></textarea>
                    </div>
                    
                    <div class="flex-1 relative">
                        <div v-if="maskColumnB && !card.showB" @click="card.showB = true" class="absolute inset-0 bg-slate-800 rounded-xl flex items-center justify-center cursor-pointer z-10 shadow-inner">
                            <span class="text-white text-xs font-bold tracking-widest opacity-80">點擊查看</span>
                        </div>
                        <textarea v-model="card.en" @change="saveToLocalStorage" rows="2" 
                                  class="w-full bg-slate-50 border border-slate-100 rounded-xl p-3 resize-none focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:bg-white transition-all font-semibold text-slate-700" 
                                  :style="{ fontSize: `${excelFontSize}px`, lineHeight: '1.4' }" placeholder="欄位 B"></textarea>
                    </div>
                </div>
            </div>

            <div v-if="filteredCards.length === 0" class="flex flex-col items-center justify-center py-20 opacity-50">
                <span class="text-6xl mb-4">📭</span>
                <p class="text-slate-500 font-bold">此分類目前沒有字卡</p>
            </div>
        </main>

        <div class="absolute bottom-6 right-6 z-40">
            <button @click="showAddModal = true" class="w-14 h-14 bg-emerald-500 text-white rounded-full shadow-[0_8px_20px_rgba(16,185,129,0.4)] flex items-center justify-center hover:scale-105 active:scale-95 transition-transform duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-7 h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
            </button>
        </div>

        <div v-if="showAddModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-0 sm:p-4 transition-opacity">
            <div class="bg-white w-full max-w-md sm:rounded-2xl rounded-t-3xl shadow-2xl overflow-hidden animate-[slideUp_0.3s_ease-out]">
                <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2"><span class="text-emerald-500">✨</span> 新增學習卡</h3>
                    <button @click="showAddModal = false" class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center hover:bg-slate-300">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                <div class="p-5 space-y-4">
                    <div class="flex gap-3">
                        <input v-model="newCard.zh" type="text" placeholder="輸入欄位 A" class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 font-medium">
                        <input v-model="newCard.en" type="text" placeholder="輸入欄位 B" class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 font-medium">
                    </div>
                    <select v-model="newCard.category" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 font-medium text-slate-600">
                        <option v-for="cat in categories.filter(c => c !== '全部')" :key="cat" :value="cat">📁 存放至：{{ cat }}</option>
                    </select>
                    
                    <div class="border-2 border-dashed border-slate-200 p-4 rounded-xl text-center relative hover:border-emerald-400 transition-colors bg-slate-50">
                        <input type="file" accept="audio/mp3, audio/*" @change="handleAudioUpload" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div v-if="!uploadStatus" class="pointer-events-none text-slate-400">
                            <span class="text-2xl mb-1 block">🎵</span>
                            <span class="text-sm font-bold">點擊此處上傳 MP3</span>
                        </div>
                        <div v-else class="pointer-events-none text-emerald-600 font-bold flex items-center justify-center gap-2">
                            <span class="text-xl">✅</span> {{ uploadStatus }}
                        </div>
                    </div>

                    <button @click="addNewCard" class="w-full bg-emerald-500 text-white py-3.5 rounded-xl font-bold text-lg hover:bg-emerald-600 shadow-lg active:scale-[0.98] transition-transform">
                        確認並加入
                    </button>
                </div>
            </div>
        </div>

        <div v-if="showSettingsModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
            <div class="bg-white rounded-2xl w-full max-w-xs shadow-2xl overflow-hidden">
                <div class="p-4 bg-slate-800 text-white flex justify-between items-center">
                    <h3 class="font-bold">⚙️ 設定與資料備份</h3>
                    <button @click="showSettingsModal = false" class="text-slate-300 hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                <div class="p-5 space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-2">🔍 調整卡片字體大小：<span class="text-emerald-600">{{ excelFontSize }}px</span></label>
                        <input type="range" min="14" max="32" v-model="excelFontSize" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                    </div>
                    <div class="pt-4 border-t border-slate-100 space-y-3">
                        <label class="block text-sm font-bold text-slate-500 mb-1">💾 資料備份與跨裝置同步</label>
                        <button @click="exportData" class="w-full bg-blue-50 text-blue-600 border border-blue-200 py-2.5 rounded-xl font-bold hover:bg-blue-100 transition-colors flex items-center justify-center gap-2">
                            📤 匯出備份檔
                        </button>
                        <label class="w-full bg-indigo-50 text-indigo-600 border border-indigo-200 py-2.5 rounded-xl font-bold hover:bg-indigo-100 transition-colors flex items-center justify-center gap-2 cursor-pointer">
                            📥 匯入同步檔
                            <input type="file" accept=".json" @change="importData" class="hidden">
                        </label>
                        <p class="text-[10px] text-slate-400 text-center mt-1">更新裝置前，請先匯出備份！</p>
                    </div>
                </div>
            </div>
        </div>

        <div v-if="showCategoryModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
            <div class="bg-white rounded-2xl w-full max-w-xs shadow-2xl overflow-hidden">
                <div class="p-4 bg-slate-100 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700">📁 管理分類清單</h3>
                    <button @click="showCategoryModal = false" class="text-slate-400 hover:text-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                <div class="p-5 space-y-4">
                    <div class="flex gap-2">
                        <input v-model="newCategoryName" @keyup.enter="addCategory" type="text" placeholder="新分類名稱..." class="flex-1 p-2 border border-slate-200 bg-slate-50 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400">
                        <button @click="addCategory" class="px-3 py-1 bg-emerald-500 text-white rounded-lg text-sm font-bold shadow-sm">新增</button>
                    </div>
                    <ul class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <li v-for="category in categories" :key="category" class="flex justify-between items-center p-2.5 rounded-lg text-sm bg-slate-50 border border-slate-100">
                            <span class="font-bold text-slate-600">{{ category }}</span>
                            <button v-if="category !== '全部'" @click="removeCategory(category)" class="text-slate-300 hover:text-red-500 p-1">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

    </div>

    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>

    <script>
        const { createApp, ref, computed, watch, onMounted } = Vue;

        createApp({
            setup() {
                const categories = ref(['全部', '日常溝通', '貓咪飲食']);
                const selectedCategory = ref('全部');
                
                // 控制彈窗狀態
                const showAddModal = ref(false);
                const showSettingsModal = ref(false);
                const showCategoryModal = ref(false);
                
                const newCategoryName = ref('');
                const excelFontSize = ref(16);
                const maskColumnA = ref(false);
                const maskColumnB = ref(false);

                const newCard = ref({ zh: '', en: '', category: '日常溝通' });
                const tempAudioData = ref('');
                const uploadStatus = ref('');
                const cards = ref([]);

                const saveToLocalStorage = () => {
                    const dataToSave = { categories: categories.value, cards: cards.value };
                    localStorage.setItem('mobile_app_data', JSON.stringify(dataToSave));
                };

                onMounted(() => {
                    // 為了無縫升級，我們同時嘗試讀取上一版 Excel 版和最新版的存檔
                    const saved = localStorage.getItem('mobile_app_data') || localStorage.getItem('excel_app_data');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            if (parsed.categories) categories.value = parsed.categories;
                            if (parsed.cards) cards.value = parsed.cards;
                        } catch (e) { console.error(e); }
                    } else {
                        cards.value = [
                            { id: 1, zh: '我該如何回覆？', en: 'How should I respond?', category: '日常溝通', audioData: '', isPlaying: false, showA: false, showB: false }
                        ];
                    }
                });

                const exportData = () => {
                    const dataStr = JSON.stringify({ categories: categories.value, cards: cards.value });
                    const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                    const linkElement = document.createElement('a');
                    linkElement.setAttribute('href', dataUri);
                    linkElement.setAttribute('download', 'My_App_Backup.json');
                    linkElement.click();
                    showSettingsModal.value = false;
                };

                const importData = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            if (imported.categories && imported.cards) {
                                categories.value = imported.categories;
                                cards.value = imported.cards;
                                saveToLocalStorage();
                                showSettingsModal.value = false;
                                alert('✅ 成功匯入資料！');
                            }
                        } catch (err) { alert('檔案格式錯誤！'); }
                    };
                    reader.readAsText(file);
                };

                watch([maskColumnA, maskColumnB], () => {
                    cards.value.forEach(c => { c.showA = false; c.showB = false; });
                });

                const filteredCards = computed(() => {
                    if (selectedCategory.value === '全部') return cards.value;
                    return cards.value.filter(card => card.category === selectedCategory.value);
                });

                const handleAudioUpload = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    uploadStatus.value = '音檔處理中...';
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        tempAudioData.value = e.target.result;
                        uploadStatus.value = `已載入: ${file.name.substring(0, 10)}`;
                    };
                    reader.readAsDataURL(file);
                };

                const addCategory = () => {
                    const name = newCategoryName.value.trim();
                    if (name && !categories.value.includes(name)) {
                        categories.value.push(name);
                        newCard.value.category = name;
                        newCategoryName.value = '';
                        saveToLocalStorage();
                    }
                };

                const removeCategory = (catToRemove) => {
                    if (confirm(`確定刪除分類「${catToRemove}」？`)) {
                        categories.value = categories.value.filter(c => c !== catToRemove);
                        if (selectedCategory.value === catToRemove) selectedCategory.value = '全部';
                        saveToLocalStorage();
                    }
                };

                const addNewCard = () => {
                    if (!newCard.value.zh || !newCard.value.en) return alert('請填寫欄位內容！');
                    if (!tempAudioData.value) return alert('請上傳 MP3 音檔！');

                    cards.value.push({
                        id: Date.now(),
                        zh: newCard.value.zh, en: newCard.value.en,
                        category: newCard.value.category,
                        audioData: tempAudioData.value, 
                        isPlaying: false, showA: false, showB: false
                    });

                    newCard.value.zh = ''; newCard.value.en = '';
                    tempAudioData.value = ''; uploadStatus.value = '';
                    
                    const fileInput = document.querySelector('input[type="file"]');
                    if (fileInput) fileInput.value = '';
                    
                    saveToLocalStorage();
                    showAddModal.value = false; // 新增完自動關閉視窗
                };

                const removeCard = (id) => {
                    if(confirm('確定刪除此字卡？')) {
                        cards.value = cards.value.filter(c => c.id !== id);
                        saveToLocalStorage();
                    }
                };

                let currentAudio = null;
                let activeCard = null;

                const playAudio = (card) => {
                    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
                    if (activeCard === card && card.isPlaying) { card.isPlaying = false; activeCard = null; return; }
                    if (activeCard) activeCard.isPlaying = false;
                    if (!card.audioData) return alert('此卡片無音檔！');

                    activeCard = card; card.isPlaying = true;
                    currentAudio = new Audio(card.audioData);
                    currentAudio.play().catch(err => { card.isPlaying = false; activeCard = null; });
                    currentAudio.onended = () => { card.isPlaying = false; activeCard = null; };
                };

                return { 
                    cards, categories, selectedCategory, filteredCards, playAudio,
                    showCategoryModal, showAddModal, showSettingsModal,
                    newCategoryName, addCategory, removeCategory,
                    newCard, addNewCard, removeCard, handleAudioUpload, uploadStatus,
                    excelFontSize, maskColumnA, maskColumnB, exportData, importData, saveToLocalStorage
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
